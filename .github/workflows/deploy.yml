name: CI / Deploy Angular to Netlify

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *' # optional: every 6 hours to trigger social sync

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install Netlify CLI
        run: npm install -g netlify-cli
      - name: Build Angular (if present)
        run: |
          if [ -d "angular" ]; then cd angular && npm ci && npm run build --if-present; fi
          if [ -d "angular_scaffold" ]; then echo "No build step for scaffold"; fi
      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          netlify deploy --prod --dir=dist --functions=netlify/functions

  scheduled-sync:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'schedule' }}
    steps:
      - uses: actions/checkout@v4
      - name: Call syncSocial function
        env:
          SYNC_FUNCTION_URL: ${{ secrets.SYNC_FUNCTION_URL }}
          GITHUB_PAT: ${{ secrets.GITHUB_PAT }}
        run: |
          curl -sS -X POST "${SYNC_FUNCTION_URL}" -H "Authorization: Bearer ${GITHUB_PAT}" || true
