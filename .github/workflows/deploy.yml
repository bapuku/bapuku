name: CI / Deploy Angular to Firebase

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *' # optional: every 6 hours to trigger social sync

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install functions dependencies
        run: |
          if [ -d "firebase_functions/functions" ]; then cd firebase_functions/functions && npm ci; fi
      - name: Build Angular (if present)
        run: |
          if [ -d "angular" ]; then cd angular && npm ci && npm run build --if-present; fi
          if [ -d "angular_scaffold" ]; then echo "No build step for scaffold"; fi
      - name: Install firebase-tools
        run: npm install -g firebase-tools
      - name: Deploy to Firebase
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          firebase deploy --only hosting,functions --project "$FIREBASE_PROJECT_ID"

  scheduled-sync:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'schedule' }}
    steps:
      - uses: actions/checkout@v4
      - name: Call syncSocial function
        env:
          SYNC_FUNCTION_URL: ${{ secrets.SYNC_FUNCTION_URL }}
          GITHUB_PAT: ${{ secrets.GITHUB_PAT }}
        run: |
          curl -sS -X POST "${SYNC_FUNCTION_URL}" -H "Authorization: Bearer ${GITHUB_PAT}" || true
